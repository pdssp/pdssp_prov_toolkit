[project]
name = "pdssp_prov_toolkit"
readme = "README.md"
description = "Shared W3C PROV-DM vocabulary, document helpers, and Graphviz/HTML rendering for FAIR-transformation provenance across PDSSP services."
authors = [{name="Jean-Christophe Malapert", email="jean-christophe.malapert@cnes.fr"}, ]
license = "Apache-2.0"
packages = [{include = "pdssp_prov_toolkit"}]
homepage = "https://gitlab.cnes.fr/pdssp/pdssp_prov_toolkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "prov>=3.1.0",
]

# ── Build ────────────────────────────────────────────────────────────────────
[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdssp_prov_toolkit"]

# ── Dev dependencies ─────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "bump-my-version>=1.2.4",
    "coverage>=7.12.0",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.0",
    "mkdocs-with-pdf>=0.9.3",
    "mkdocstrings[python]>=1.0.0",
    "pip-licenses>=5.5.0",
    "pre-commit>=4.5.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.0.1",
    "pytest-html>=4.1.1",
    "pytest-json-report>=1.5.0",
    "pytest-profiling>=1.8.1",
    "pytest-mock>=3.15.1",
    "black>=25.11.0",
    "tox>=4.32.0",
    "flake8>=7.3.0",
    "mccabe>=0.7.0",
    "mypy>=1.19.0",
    "pylint>=4.0.4",
    "toml>=0.10.2",
]

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | docs
  | scripts
  | docker
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.bandit]
exclude_dirs = [".venv", "tests", "scripts"]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
